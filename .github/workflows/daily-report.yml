name: Daily store report (10am PKT)

on:
  schedule:
    # BACKUP ONLY. The main 10am run is started by an external daily
    # trigger (workflow_dispatch at ~9:50 AM PKT), because GitHub's own
    # cron is often hours late. This backup fires at 10:37 AM PKT
    # (05:37 UTC) and skips itself if today's report already went out.
    - cron: "37 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

concurrency:
  group: daily-report
  cancel-in-progress: false

jobs:
  # On scheduled (backup) runs, skip if a report already ran or is running
  # today (Pakistan date). Manual / API-triggered runs always go ahead.
  gate:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          today=$(TZ=Asia/Karachi date +%Y-%m-%d)
          count=$(gh api "repos/${{ github.repository }}/actions/workflows/daily-report.yml/runs?created=>=${today}T00:00:00%2B05:00&per_page=50" \
            --jq "[.workflow_runs[] | select(.id != ${{ github.run_id }}) | select(.conclusion == \"success\" or .status == \"in_progress\" or .status == \"queued\")] | length")
          echo "Runs already today ($today PKT): $count"
          if [ "$count" -gt 0 ]; then echo "go=false" >> "$GITHUB_OUTPUT"; else echo "go=true" >> "$GITHUB_OUTPUT"; fi

  report:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install browser (Chromium)
        run: npx playwright install --with-deps chromium

      # Restores yesterday's results so the email can mark what is NEW today.
      - name: Restore report history
        uses: actions/cache@v4
        with:
          path: reports/history
          key: report-history-${{ github.run_id }}
          restore-keys: report-history-

      - name: Run checks and email the report
        env:
          SHOPIFY_STORE_DOMAIN: ${{ secrets.SHOPIFY_STORE_DOMAIN }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
          SHOPIFY_ADMIN_TOKEN: ${{ secrets.SHOPIFY_ADMIN_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_CC: ${{ secrets.MAIL_CC }}
        run: npm run report

      - name: Save report files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: store-report-${{ github.run_number }}
          path: |
            reports/report.html
            reports/issues.csv
            reports/report.json
            reports/homepage-mobile.jpg
          if-no-files-found: ignore
          retention-days: 30
